<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D2824" />
      <stop offset="100%" stop-color="#141210" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="50%" stop-color="#E2D4C0" />
      <stop offset="100%" stop-color="#C5B198" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.3" />

  <!-- Stylized Fashion Hanger & Sparkle Emblem -->
  <g filter="url(#shadow)" transform="translate(0, 16)">
    <!-- Hanger Hook -->
    <path d="M256 140 C236 140, 222 154, 222 174 C222 194, 240 208, 256 220 L256 242"
          fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Hanger Triangle Frame -->
    <path d="M256 242 L132 316 C118 324, 126 346, 142 346 L370 346 C386 346, 394 324, 380 316 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Horizontal Bar Accent -->
    <line x1="148" y1="346" x2="364" y2="346" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- AI Sparkle 1 (Top Right) -->
    <path d="M372 136 Q372 168 396 168 Q372 168 372 200 Q372 168 348 168 Q372 168 372 136 Z"
          fill="url(#goldGrad)" />

    <!-- AI Sparkle 2 (Bottom Left) -->
    <path d="M142 210 Q142 228 156 228 Q142 228 142 246 Q142 228 128 228 Q142 228 142 210 Z"
          fill="url(#goldGrad)" opacity="0.85" />
  </g>
</svg>
